name: Assemble implemented task pool
'on':
  push:
    branches: [finalpool]
    paths: ['.github/workflows/assemble-finalpool.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assemble-finalpool
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/finalpool'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: finalpool
          fetch-depth: 0
      - name: Copy and verify task trees without running task code
        shell: python
        run: |
          import json, subprocess
          def git(*args, input=None):
              return subprocess.run(['git', *args], input=input, text=True, check=True, capture_output=True).stdout.strip()
          specs = [
              ('lueyang-dev', 'lueyang', 'bf8b9a1d25edd81b158db0bb7f49d8624348e74d', 'activity-logger crm-system deal-manager email-campaign follow-up-reminder sales-pipeline'),
              ('yuzhen-dev', 'yuzhen', 'c68265dafe0a0eccc6e183ff96d1a3e5591a3d8b', 'alert-system invoice-generator data-validator form-builder permission-manager payment-processor'),
              ('yuxuan-dev', 'yuxuan', 'e82c8295f9506ced6862ab7f39048a731b48beb4', 'asset-optimizer content-manager task-scheduler network-analyzer'),
              ('xiaochen_dev', 'xiaochen', '20bfc73490dcf4029b92123b6055e076b7eb5dfa', 'backup-utility monitoring-agent deployment-tool error-tracker security-scanner'),
              ('gyy', 'gyy', '9612ffff37072726292c77df0f4c6db2f8df1bbb', 'blog-engine cms-builder content-scheduler social-publisher'),
              ('junteng_dev', 'junteng', '4ab0c5415824d799c3457a26482f9b794c7e9e93', 'booking-system calendar-sync contact-manager shipment-tracker reminder-service product-catalog order-processor'),
              ('wenshuo-dev', 'wenshuo', 'd11080ed8d65fb72eb32d9353cb20844b593f9e8', 'image-processor search-engine'),
              ('ruige', 'ruige', 'a6f3fba387f68acaf6517803e88b40a4a3c52658', 'canvas-automation data-analytics expense-tracker file-manager'),
              ('jl_dev', 'jl', '4e2b63f5dafce88b60886ed6e6af7bd9a8966296', 'canvas-grade-automation email-classification-system pdf-report-generator'),
              ('lv', 'lv', '0be3288e0fd4ae1f241d3ce9cc1c864ae2606d37', 'chat-bot voice-processor feedback-collector sentiment-analyzer personalization-service'),
              ('zhaochen', 'zhaochen', 'b5f9cc4f79bb9218e40c0293ab9ec4e90352a626', 'load-balancer template-engine'),
              ('fan-dev', 'fan', '8b90f34538e4e106eba103265efaa9a456be498c', 'coupon-manager price-tracker'),
              ('haoze', 'haoze', 'e0072cf979548c56984072cd76f529c7beea59b2', 'video-trimmer subtitle-generator'),
              ('junxian_dev', 'junxian', '96bbc11b6fc701d07d961aaf070c434fccd1794f', 'translation-api qr-generator'),
          ]
          sources = sorted([{'task': name, 'branch': branch, 'commit': sha, 'source': f'tasks/{directory}/{name}', 'destination': f'tasks/finalpool/{name}'} for branch, directory, sha, names in specs for name in names.split()], key=lambda s: s['task'])
          assert len(sources) == len({s['task'] for s in sources}) == 54
          assert git('branch', '--show-current') == 'finalpool'
          assert not git('ls-tree', 'HEAD', 'tasks/finalpool'), 'Destination already exists; refusing overwrite'
          git('read-tree', 'HEAD')
          for s in sources:
              source = s['commit'] + ':' + s['source']
              assert git('cat-file', '-t', source) == 'tree', source
              s['tree'] = git('rev-parse', source)
              git('read-tree', '--prefix=' + s['destination'] + '/', source)
              print('Collected', s['task'], s['tree'], flush=True)
          tree = git('write-tree')
          assert set(git('ls-tree', '--name-only', tree + ':tasks/finalpool').splitlines()) == {s['task'] for s in sources}
          for s in sources:
              assert git('rev-parse', tree + ':' + s['destination']) == s['tree'], s['task']
          metadata = {'notion_database': 'https://www.notion.so/406b0d6134e481139df6eefa4f38ddbd', 'selection': 'All 54 tasks already marked implemented in Task Tracker; all 30 newly reviewed tasks remain implementing and are excluded.', 'tasks': sources}
          blob = git('hash-object', '-w', '--stdin', input=json.dumps(metadata, indent=2) + '\n')
          git('update-index', '--add', '--cacheinfo', '100644,' + blob + ',tasks/finalpool/SOURCES.json')
          changed = git('diff', '--cached', '--name-only').splitlines()
          assert changed and all(p.startswith('tasks/finalpool/') for p in changed)
          git('-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'Collect all 54 Notion-implemented tasks in tasks/finalpool')
          for s in sources:
              assert git('rev-parse', 'HEAD:' + s['destination']) == s['tree'], s['task']
          git('push', 'origin', 'HEAD:refs/heads/finalpool')
          print('Verified and pushed 54 exact task trees at', git('rev-parse', 'HEAD'), flush=True)
